[package]
name = "quantum_pq_vault"
version = "0.0.1"
edition = "2021"
description = "Mode B research core: WOTS/Merkle-authorized creator first-buy vault policy. NOT DEPLOYED, NOT AUDITED, no entrypoint."
publish = false

[features]
default = []
# Freeze MAINNET_GENESIS instead of DEVNET_GENESIS. Separate build, separate deployment record.
mainnet = []

[workspace]

[dependencies]
sha2 = { version = "0.10", default-features = false }

[lints.rust]
