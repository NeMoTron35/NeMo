name: Quantum Vault verified SBF + Bankrun (no deploy)

on:
  push:
    branches:
      - "quantum-vault-devnet-*"
  pull_request:
    paths:
      - "programs/**"
      - ".github/workflows/quantum-vault-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vault-devnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiled-program-tests:
    name: Agave SBF + real SPL Bankrun tests
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - name: Install Rust and formatting
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install pinned Agave 2.2.20 toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.2.20/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/qli-agave.tar.bz2
          tar -xjf /tmp/qli-agave.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
      - name: Verify version and formatting
        run: |
          set -euo pipefail
          solana --version
          cargo fmt --manifest-path programs/Cargo.toml --all --check
      - name: Rust policy tests and program host compilation
        run: |
          set -euo pipefail
          cargo test --manifest-path programs/Cargo.toml -p quantum_vault_policy --locked
          cargo check --manifest-path programs/quantum_vault/Cargo.toml --locked
      - name: Compile genuine SBF program using v1.57 platform tools
        env:
          CARGO_TARGET_DIR: /tmp/qli-vault-target
        run: |
          set -euo pipefail
          mkdir -p /tmp/qli-vault-artifacts
          cargo-build-sbf --manifest-path programs/quantum_vault/Cargo.toml --tools-version v1.57 --sbf-out-dir /tmp/qli-vault-artifacts
          test -s /tmp/qli-vault-artifacts/quantum_vault.so
          sha256sum /tmp/qli-vault-artifacts/quantum_vault.so
      - name: Install Bankrun test dependencies
        working-directory: programs
        run: bun install --no-save
      - name: Test compiled SBF with real classic SPL token transactions
        working-directory: programs
        env:
          QLI_VAULT_SBF: "1"
          BPF_OUT_DIR: /tmp/qli-vault-artifacts
        run: bunx vitest run tests/qli-vault-bankrun.test.ts
      - name: Upload review artifact (binary + IDL; no key)
        uses: actions/upload-artifact@v4
        with:
          name: quantum-vault-devnet-unsigned-${{ github.sha }}
          path: |
            /tmp/qli-vault-artifacts/quantum_vault.so
            programs/idl/quantum_vault.json
          if-no-files-found: error
          retention-days: 7

# No wallet key generation, signer, deployment, custodial funds or mainnet action.
# Public-network devnet deployment needs separate owner-held upgrade authority.
