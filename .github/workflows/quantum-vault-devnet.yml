name: Quantum Vault devnet readiness (no deploy)

on:
  push:
    branches:
      - "quantum-vault-devnet-*"
    paths:
      - "programs/**"
      - ".github/workflows/quantum-vault-devnet.yml"
  pull_request:
    paths:
      - "programs/**"
      - ".github/workflows/quantum-vault-devnet.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quantum-vault-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solana-program:
    name: Rust, Anchor SBF build and local validator
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: programs
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Anchor 0.31.1 and Solana CLI 2.1.0
        uses: metadaoproject/setup-anchor@v3.4
        with:
          anchor-version: "0.31.1"
          solana-cli-version: "2.1.0"
          node-version: "20.19.0"
      - name: Verify Solana local CLI and validator
        run: |
          set -euo pipefail
          solana --version
          solana-test-validator --version
          cargo --version
      - name: Resolve pinned Solana SBF-compatible crypto dependency
        run: |
          set -euxo pipefail
          cargo update -p blake3 --precise 1.5.4
          cargo update -p proc-macro-crate@3.5.0 --precise 3.3.0
          cargo update -p zeroize@1.9.1 --precise 1.8.2
          cargo update -p indexmap@2.14.2 --precise 2.2.6
          cargo tree -i blake3
      - name: Check Rust formatting
        run: cargo fmt --all --check
      - name: Execute Rust policy unit tests
        run: cargo test -p quantum_vault_policy --locked
      - name: Check program host compilation
        run: cargo check -p quantum_vault --locked
      - name: Build actual Solana SBF binary with Solana toolchain
        run: |
          set -euxo pipefail
          cargo build-sbf --manifest-path quantum_vault/Cargo.toml --sbf-out-dir target/deploy
          test -s target/deploy/quantum_vault.so
          sha256sum target/deploy/quantum_vault.so
      - name: Generate Anchor IDL and diagnose packaging
        run: |
          set -euxo pipefail
          mkdir -p target/idl
          docker run --rm --entrypoint /bin/bash -v "$PWD:/workspace" -w /workspace solanafoundation/anchor@sha256:21ab8a16e19df4301a198d7a55ab2988549aa2d996e6b5ad229c1d95b9f2d326 -lc 'set -eux; anchor --version; rustc --version; cargo --version; ls -lah; anchor idl build -o target/idl/quantum_vault.json'
          test -s target/idl/quantum_vault.json
      - name: Inspect compiled artifacts
        run: |
          test -s target/deploy/quantum_vault.so
          test -s target/idl/quantum_vault.json
          sha256sum target/deploy/quantum_vault.so
          ls -lh target/deploy/quantum_vault.so target/idl/quantum_vault.json
      - name: Run real Solana local-validator vault security tests
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          solana-keygen new --no-bip39-passphrase --force -o "$RUNNER_TEMP/qli-validator-payer.json" >/dev/null
          solana-test-validator --reset --quiet --ledger "$RUNNER_TEMP/qli-validator-ledger" --bpf-program 93v9K8ytGDR3BAoxtaVVo7u1oaBv3Pu257eBAPCp7SH5 target/deploy/quantum_vault.so > "$RUNNER_TEMP/qli-validator.log" 2>&1 &
          VALIDATOR_PID=$!
          trap 'kill $VALIDATOR_PID || true' EXIT
          for i in $(seq 1 35); do
            if solana cluster-version --url http://127.0.0.1:8899 > /dev/null 2>&1; then break; fi
            sleep 2
          done
          solana cluster-version --url http://127.0.0.1:8899 || (cat "$RUNNER_TEMP/qli-validator.log"; exit 1)
          solana airdrop 20 "$(solana-keygen pubkey "$RUNNER_TEMP/qli-validator-payer.json")" --url http://127.0.0.1:8899
          ANCHOR_PROVIDER_URL=http://127.0.0.1:8899 ANCHOR_WALLET="$RUNNER_TEMP/qli-validator-payer.json" npm run test:integration
      - name: Save unsigned build artifacts for independent review
        uses: actions/upload-artifact@v4
        with:
          name: quantum-vault-devnet-unsigned-${{ github.sha }}
          path: |
            programs/target/deploy/quantum_vault.so
            programs/target/idl/quantum_vault.json
          if-no-files-found: error
          retention-days: 7

# No deployment, wallet signing, or mainnet step.
# Validator tests + verified owner-managed deployment authority are prerequisites.
