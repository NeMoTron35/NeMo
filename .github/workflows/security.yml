name: Security checks
on:
  push:
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-and-source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun run audit:dependencies
      - name: Repository and secret checks
        if: always()
        run: bun run check:repository
      - name: Static source checks
        if: always()
        run: bun run lint
