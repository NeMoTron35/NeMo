# Mainnet SBF AUDIT CANDIDATE build of the Mode B vault. Manual only. NOT a production approval.
# No secrets, no wallet, no signer, no RPC, no deploy, no transactions. Uploads only the compiled
# .so, its checksum and the public build manifest for an independent auditor to reproduce.
name: Mainnet SBF Audit Candidate
on:
  workflow_dispatch:
    inputs:
      agave_tarball_sha256:
        description: "SHA-256 of solana-release-x86_64-unknown-linux-gnu.tar.bz2 from the official anza-xyz/agave v2.2.20 release page (asset digest)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: qli-pq-mainnet-audit-candidate
  cancel-in-progress: false
env:
  EXPECTED_MAINNET_PROGRAM_ID: 6P39VXXxxRHoCX7eJCKC5Tkaf4SUxdJDAeJvzykA8q7Z
  AGAVE_VERSION: v2.2.20
  PLATFORM_TOOLS: v1.57
jobs:
  audit-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - name: Fail closed on program id mismatch (source, Anchor.toml, release status)
        run: bun scripts/mainnet-audit-candidate-check.ts
      - name: Install pinned Agave with integrity check
        env:
          WANT: ${{ inputs.agave_tarball_sha256 }}
        run: |
          [[ "$WANT" =~ ^[0-9a-f]{64}$ ]] || { echo "Input must be a lowercase 64-hex SHA-256" >&2; exit 1; }
          curl --fail --location --retry 3 -o /tmp/agave.tar.bz2 \
            "https://github.com/anza-xyz/agave/releases/download/${AGAVE_VERSION}/solana-release-x86_64-unknown-linux-gnu.tar.bz2"
          echo "$WANT  /tmp/agave.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/agave.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build run 1 (--features mainnet via build script)
        run: |
          cargo-build-sbf --version | tee /tmp/cargo-build-sbf.version
          bash scripts/build-pq-vault-sbf.sh mainnet-beta
          mkdir -p /tmp/run1 && cp target/pq-vault-mainnet-beta/* /tmp/run1/
      - name: Independent clean build run 2 (fresh checkout, compare checksum)
        run: |
          rm -rf /tmp/clean && git clone --no-local --quiet "$GITHUB_WORKSPACE" /tmp/clean
          git -C /tmp/clean checkout --quiet "$GITHUB_SHA"
          (cd /tmp/clean && CARGO_TARGET_DIR=/tmp/clean-target bash scripts/build-pq-vault-sbf.sh mainnet-beta)
          A=$(cut -d' ' -f1 /tmp/run1/quantum_pq_first_buy_vault.so.sha256)
          B=$(cut -d' ' -f1 /tmp/clean/target/pq-vault-mainnet-beta/quantum_pq_first_buy_vault.so.sha256)
          echo "run1=$A run2=$B"
          [ "$A" = "$B" ] || { echo "Non-reproducible: checksums differ" >&2; exit 1; }
      - name: Verify manifest and confirm no keypair in output
        run: |
          cd /tmp/run1
          if ls | grep -qi keypair; then echo "Keypair file found in output" >&2; exit 1; fi
          if grep -Eq '\[\s*[0-9]+\s*,\s*[0-9]+' build-manifest.json; then echo "Keypair-like content" >&2; exit 1; fi
          node -e '
            const m=JSON.parse(require("fs").readFileSync("build-manifest.json","utf8"));
            const want=process.env.EXPECTED_MAINNET_PROGRAM_ID;
            if(m.network!=="mainnet-beta"||m.programId!==want||m.features!=="--features mainnet"||m.toolsVersion!=="v1.57"||m.provisional!==false){console.error("Manifest mismatch",m);process.exit(1)}'
          sha256sum -c quantum_pq_first_buy_vault.so.sha256
          {
            echo "AUDIT CANDIDATE ONLY — NOT production approved, NOT deployed, NOT audited."
            echo "source_commit=$GITHUB_SHA"
            echo "repository=$GITHUB_REPOSITORY run_id=$GITHUB_RUN_ID"
            echo "agave_tarball_sha256=${{ inputs.agave_tarball_sha256 }}"
            echo "cargo_build_sbf=$(cat /tmp/cargo-build-sbf.version | head -1)"
            echo "platform_tools=$PLATFORM_TOOLS"
            echo "program_id=$EXPECTED_MAINNET_PROGRAM_ID"
            echo "cargo_toml_sha256=$(sha256sum $GITHUB_WORKSPACE/programs/quantum_pq_first_buy_vault/Cargo.toml | cut -d' ' -f1)"
            echo "cargo_lock_sha256=$(sha256sum $GITHUB_WORKSPACE/programs/Cargo.lock | cut -d' ' -f1)"
            echo "lib_rs_sha256=$(sha256sum $GITHUB_WORKSPACE/programs/quantum_pq_first_buy_vault/src/lib.rs | cut -d' ' -f1)"
            echo "reproduced_in_ci=true"
          } > AUDIT_CANDIDATE.txt
          cat build-manifest.json AUDIT_CANDIDATE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: qli-pq-vault-mainnet-audit-candidate-${{ github.sha }}
          if-no-files-found: error
          retention-days: 90
          path: |
            /tmp/run1/quantum_pq_first_buy_vault.so
            /tmp/run1/quantum_pq_first_buy_vault.so.sha256
            /tmp/run1/build-manifest.json
            /tmp/run1/AUDIT_CANDIDATE.txt