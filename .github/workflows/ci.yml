name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - run: bun run check:repository
  vault-sbf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"
      - run: bun install --frozen-lockfile
      - name: Install pinned Agave build tooling
        run: |
          curl --fail --location --retry 3 https://github.com/anza-xyz/agave/releases/download/v2.2.20/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/agave.tar.bz2
          tar -xjf /tmp/agave.tar.bz2 -C /tmp
          echo "/tmp/solana-release/bin" >> "$GITHUB_PATH"
      - name: Build and execute compiled vault (no deployment)
        env:
          CARGO_TARGET_DIR: /tmp/qli-vault-target
          BPF_OUT_DIR: /tmp/qli-vault-artifacts
          QLI_VAULT_SBF: "1"
        run: |
          cargo test --manifest-path programs/Cargo.toml -p quantum_vault_policy --locked
          cargo-build-sbf --manifest-path programs/quantum_vault/Cargo.toml --tools-version v1.57 --sbf-out-dir /tmp/qli-vault-artifacts
          bunx vitest run src/test/quantum-vault-sbf.test.ts
          rm -f /tmp/qli-vault-artifacts/quantum_vault-keypair.json
      - name: Generate IDL with pinned Anchor and Rust
        env:
          RUSTUP_TOOLCHAIN: nightly-2025-11-01
          CARGO_TARGET_DIR: /tmp/qli-vault-idl-target
        run: |
          rustup toolchain install nightly-2025-11-01 --profile minimal
          cargo install anchor-cli --version 0.31.1 --locked --root /tmp/qli-anchor
          cd programs
          /tmp/qli-anchor/bin/anchor idl build -p quantum_vault -o /tmp/qli-vault-artifacts/quantum_vault.json -- --locked
          node -e 'const fs=require("fs"), assert=require("assert"); assert.deepStrictEqual(JSON.parse(fs.readFileSync("idl/quantum_vault.json")),JSON.parse(fs.readFileSync("/tmp/qli-vault-artifacts/quantum_vault.json")))'