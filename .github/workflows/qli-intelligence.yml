name: QLi Intelligence deterministic security suite

on:
  push:
    branches:
      - "qli-neural-shadow-proof-threat-arena-*"
    paths:
      - "research/qli-intelligence/**"
      - ".github/workflows/qli-intelligence.yml"
  pull_request:
    paths:
      - "research/qli-intelligence/**"
      - ".github/workflows/qli-intelligence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-reference:
    name: Node.js Shadow + Proof + Graph + HF safety
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify no secrets or blockchain signers are needed
        run: |
          set -euo pipefail
          test -f research/qli-intelligence/core.mjs
          test -f research/qli-intelligence/huggingface.mjs
          echo "Reference tests run OFFLINE: no RPC, no HF_TOKEN, no deploy key, no wallets."
      - name: Deterministic, adversarial reference tests
        run: node --test research/qli-intelligence/*.test.mjs
      - name: Check source module syntax
        run: |
          node --check research/qli-intelligence/core.mjs
          node --check research/qli-intelligence/huggingface.mjs

# Tests establish reference correctness of the documented model only.
# This is not verification of a Meteora DBC pool quote, a cryptographic signature,
# a Solana program or an on-chain upgrade authority.
